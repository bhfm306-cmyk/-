<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | بوابة حسابات الطلاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <header class="main-header no-print">
        <div class="header-banner">
            <div class="logo-group">
                <img src="rowad.png" alt="شعار مدارس الرواد" class="logo">
            </div>
            <div class="header-titles">
                <h1>لوحة تحكم النظام</h1>
                <h2>مجمع مدارس الرواد الأهلية - فرع قرطبة</h2>
            </div>
            <div class="logo-group left-group">
                <img src="ataa.png" alt="شعار عطاء التعليمية" class="logo">
                <a href="index.html" class="admin-btn back-btn" title="العودة">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    عودة للطلاب
                </a>
            </div>
        </div>
    </header>

    <main class="container admin-container">
        <section id="login" class="login-section no-print">
            <div class="login-card glass-card">
                <div style="text-align: center; margin-bottom: 20px; color: #fff;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <h2>دخول الإدارة</h2>
                </div>
                <form id="f">
                    <div class="input-group">
                        <div class="input-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                        <input type="text" id="u" placeholder="اسم مستخدم الإدارة" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <div class="input-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
                        <input type="password" id="p" placeholder="كلمة المرور" required autocomplete="off">
                    </div>
                    <div id="err" class="error-msg" style="display: none;"></div>
                    <button type="submit" class="btn-primary">دخول آمن</button>
                </form>
            </div>
        </section>

        <section id="panel" style="display: none;">
            <div id="stats" class="stats-grid no-print"></div>
            <div class="toolbar glass-card no-print">
                <div class="filters-group">
                    <input type="text" id="q" class="filter-input" placeholder="بحث باسم الطالب أو الهوية...">
                    <select id="g" class="filter-select"><option value="">كل الصفوف</option></select>
                </div>
                <div class="actions-group">
                    <span id="cnt" class="badge">العدد: 0</span>
                    <button id="prt" class="btn-secondary">طباعة الملصقات</button>
                    <button id="out" class="btn-danger">خروج</button>
                </div>
            </div>
            <div id="cards" class="cards-grid"></div>
        </section>
    </main>
    <footer id="footer" class="no-print"><p>تصميم وبرمجة الأستاذ/ بهجت محمود - منسق التحول الرقمي</p></footer>
    <script src="common.js"></script>
    <script src="admin.js"></script>
</body>
</html>
